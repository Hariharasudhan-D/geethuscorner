spring.application.name=backend

# Load secrets from the .env file (if it exists)
# First path: running from the backend folder (terminal)
# Second path: running from the Geethuscorner folder (IntelliJ)
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Server port (Render gives us PORT later; locally it's 8080)
server.port=${PORT:8080}

# PostgreSQL Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.hikari.initialization-fail-timeout=60000


# JWT (login wristband)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=24

# Connection pool (Supabase free allows ~15 connections)
# Max 4 connections per app (old + new + laptop = 12, under 15)
spring.datasource.hikari.maximum-pool-size=4
# Keep only 1 open when idle, release the rest
spring.datasource.hikari.minimum-idle=1
# Close unused connections after 30 seconds
spring.datasource.hikari.idle-timeout=30000
# Wait max 20s for a connection before failing
spring.datasource.hikari.connection-timeout=20000
